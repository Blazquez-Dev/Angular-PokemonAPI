<a class="btn btn-outline-danger mb-3" routerLink="/items">← Volver al listado</a>
@if (item$ | async; as i) {
  <div class="card">
    <div class="card-body">
      @if (i.sprites.default) {
        <img class="img-fluid d-block mx-auto" width="120" height="120" [src]="i.sprites.default" [alt]="i.name" />
      }
      <h2 class="text-capitalize text-center">#{{ i.id }} {{ i.name }}</h2>
      <table class="table table-sm w-auto mx-auto text-capitalize">
        <tr><th>Categoría</th><td>{{ i.category.name }}</td></tr>
        <tr><th>Coste</th><td>{{ i.cost }} ₽</td></tr>
      </table>
      <h3 class="h5 mt-3">Efecto</h3>
      <p>{{ effect(i) }}</p>
      @if (i.attributes.length) {
        <h3 class="h5">Atributos</h3>
        @for (a of i.attributes; track a.name) {
          <span class="badge text-bg-secondary text-capitalize me-1">{{ a.name }}</span>
        }
      }
    </div>
  </div>
} @else {
  <div class="text-center my-5"><div class="spinner-border text-danger"></div></div>
}
